<script>
    const dataMapping = {
        cities: {
            'France': ['Paris', 'Lyon', 'Marseille'],
            'Tunisia': ['Tunis', 'Sfax', 'Sousse']
        },
        services: {
            'Info': ['MOA', 'IT Support', 'Data ', 'Network'],
            'HR': ['Payroll', 'Recruitment', 'Employee Relations']
        },
        jobs: {
            'Info': ['Director', 'Manager', 'Team Leader', 'Senior', 'Junior', 'Trainee'],
            'HR': ['Director', 'Manager', 'Team Leader', 'Senior', 'Junior', 'Trainee']
        }
    };

    function updateCities() {
        const country = document.getElementById('countrySelect').value;
        const citySelect = document.getElementById('citySelect');
        citySelect.innerHTML = '<option value="">-- Select City --</option>';
        
        if (dataMapping.cities[country]) {
            dataMapping.cities[country].forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                if (city === "Tunis") option.selected = true;
                citySelect.appendChild(option);
            });
        }
    }

    function updateServicesAndJobs() {
        const dept = document.getElementById('deptSelect').value;
        const serviceSelect = document.getElementById('serviceSelect');
        const jobSelect = document.getElementById('jobSelect');
        
        serviceSelect.innerHTML = '<option value="">-- Select Service --</option>';
        jobSelect.innerHTML = '<option value=\"\">-- Select Job Title --</option>';
        
        if (dataMapping.services[dept]) {
            dataMapping.services[dept].forEach(srv => {
                const option = document.createElement('option');
                option.value = srv;
                option.textContent = srv;
                if (srv === "MOA") option.selected = true;
                serviceSelect.appendChild(option);
            });
        }

        if (dataMapping.jobs[dept]) {
            dataMapping.jobs[dept].forEach(job => {
                const option = document.createElement('option');
                option.value = job;
                option.textContent = job;
                if (job === "Manager") option.selected = true;
                jobSelect.appendChild(option);
            });
        }

        // show/hide manager/team-leader selectors based on current job
        toggleSupervisorDropdowns();
    }

    function toggleSupervisorDropdowns() {
        const job = document.getElementById('jobSelect').value;
        const mgrWrapper = document.getElementById('manager-select-wrapper');
        const tlWrapper = document.getElementById('tl-select-wrapper');

        if (mgrWrapper) mgrWrapper.style.display = 'none';
        if (tlWrapper) tlWrapper.style.display = 'none';

        if (job === 'Manager') {
            if (mgrWrapper) mgrWrapper.style.display = 'block';
        } else if (job === 'Team Leader') {
            if (tlWrapper) tlWrapper.style.display = 'block';
        }
    }

    // Initialize selects to current profile values when page loads
    document.addEventListener('DOMContentLoaded', function() {
        updateCities();
        updateServicesAndJobs();
    });
